[package]
name = "codex-auth-manager"
version = "0.1.3"
edition = "2024"
readme = "README.md"
description = "A deadly simple Codex auth manager / account switcher."
keywords = ["codex", "auth", "cli"]
categories = ["command-line-utilities", "authentication", "development-tools"]
include = ["src", "README.md", "LICENSE"]
repository = "https://github.com/PRO-2684/codex-auth-manager"
license = "MIT"
authors = ["PRO-2684"]

[dependencies]
base64 = { version = "0.23.1", optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"], optional = true }
declerror = "0.2.1"
macro_rules_attr = "0.2.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }

[[bin]]
name = "cam"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["clap", "clap_complete", "identity-details"]
identity-details = ["base64", "serde_json", "serde"]

[profile.release]
debug = false     # Disable debug information in release builds.
strip = true      # Automatically strip symbols from the binary.
lto = true        # Enable link-time optimization.
codegen-units = 1 # Set the number of codegen units to 1.

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.docs.rs]
features = ["identity-details"]
